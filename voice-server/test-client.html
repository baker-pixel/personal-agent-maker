<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sonic voice test</title>
<style>
  body { font-family: system-ui; max-width: 640px; margin: 40px auto; }
  button { font-size: 18px; padding: 12px 24px; }
  #log { margin-top: 16px; white-space: pre-wrap; background: #f4f4f4; padding: 12px; border-radius: 8px; min-height: 200px; }
  .user { color: #0a58ca; } .assistant { color: #157347; }
</style></head>
<body>
<h2>Nova 2 Sonic — mic test</h2>
<p><input id="token" placeholder="Supabase user JWT (paste from app localStorage)" style="width:100%;padding:8px"></p>
<button id="btn">Start talking</button>
<div id="log"></div>
<script>
const log = (cls, text) => {
  const d = document.createElement("div");
  d.className = cls; d.textContent = text;
  document.getElementById("log").appendChild(d);
};

let ws, micCtx, playCtx, playHead = 0, active = false, sources = [];

async function start() {
  ws = new WebSocket(`ws://${location.host}`);
  await new Promise((r) => ws.onopen = r);
  ws.send(JSON.stringify({
    type: "start",
    token: document.getElementById("token").value.trim(),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  }));

  playCtx = new AudioContext({ sampleRate: 24000 });
  playHead = playCtx.currentTime;

  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "audio") {
      const bytes = Uint8Array.from(atob(m.data), (c) => c.charCodeAt(0));
      const i16 = new Int16Array(bytes.buffer);
      const f32 = Float32Array.from(i16, (v) => v / 32768);
      const buf = playCtx.createBuffer(1, f32.length, 24000);
      buf.copyToChannel(f32, 0);
      const src = playCtx.createBufferSource();
      src.buffer = buf; src.connect(playCtx.destination);
      playHead = Math.max(playHead, playCtx.currentTime);
      src.start(playHead); playHead += buf.duration;
      sources.push(src);
    } else if (m.type === "transcript") {
      log(m.role === "USER" ? "user" : "assistant", `${m.role}: ${m.text}`);
    } else if (m.type === "interrupted") {
      sources.forEach((s) => { try { s.stop(); } catch {} });
      sources = []; playHead = playCtx.currentTime;
      log("", "[barge-in: playback stopped]");
    } else if (m.type === "toolUse") {
      log("", `[tool: ${m.name}…]`);
    } else if (m.type === "toolResult") {
      log("", `[tool ${m.name}: ${m.success ? "ok" : "failed"} — ${m.message}]`);
    } else if (m.type === "error") {
      log("", `ERROR: ${m.message}`);
    }
  };

  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  micCtx = new AudioContext({ sampleRate: 16000 });
  const srcNode = micCtx.createMediaStreamSource(stream);
  const proc = micCtx.createScriptProcessor(2048, 1, 1);
  proc.onaudioprocess = (ev) => {
    if (!active || ws.readyState !== 1) return;
    const f32 = ev.inputBuffer.getChannelData(0);
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
    ws.send(JSON.stringify({ type: "audio", data: btoa(String.fromCharCode(...new Uint8Array(i16.buffer))) }));
  };
  srcNode.connect(proc); proc.connect(micCtx.destination);
  active = true;
  log("", "[mic live — speak now]");
}

document.getElementById("btn").onclick = async function () {
  if (!active) { this.textContent = "Stop"; await start(); }
  else {
    active = false;
    ws?.send(JSON.stringify({ type: "stop" })); ws?.close();
    micCtx?.close(); playCtx?.close();
    this.textContent = "Start talking";
    log("", "[stopped]");
  }
};
</script>
</body>
</html>
